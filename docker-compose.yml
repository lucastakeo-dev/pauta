services:
  db:
    image: postgres:17-alpine
    container_name: pauta-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: pauta
      POSTGRES_PASSWORD: pauta
      POSTGRES_DB: pauta
    ports:
      # 5432/5433/5439 e 55432 já estão ocupadas por outros projetos da máquina
      - '127.0.0.1:5441:5432'
    volumes:
      - pauta-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U pauta -d pauta']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pauta-pgdata:
